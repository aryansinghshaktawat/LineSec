version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: linesec_admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: linesec_core_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
